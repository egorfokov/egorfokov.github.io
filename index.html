// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : {
      [keyOrEdits]: val
    };
    setValues(prev => ({
      ...prev,
      ...edits
    }));
    window.parent.postMessage({
      type: '__edit_mode_set_keys',
      edits
    }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', {
      detail: edits
    }));
  }, []);
  return [values, setTweak];
}

// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({
  title = 'Tweaks',

  // and pass noDeckControls to suppress this one.

      filter: brightness(0.7) saturate(0.5);
      transition:
        transform 1.4s cubic-bezier(0.22,1,0.36,1),
        filter    1.2s ease;
    }
    .fk-img-wrap.fk-in img {
      transform: scale(1);
      filter: brightness(1) saturate(1);
    }

    /* number */
    .fk-num { font-variant-numeric: tabular-nums; }
  `;
  document.head.appendChild(style);

  /* ── Helpers ───────────────────────────────── */
  function makeObs(cb, thr) {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { cb(e.target); obs.unobserve(e.target); }
      });
    }, { threshold: thr || 0.1 });
    return obs;
  }

  function splitWords(el) {
    el.innerHTML = el.innerHTML.replace(/(<[^>]+>)|([^\s<]+)/g, (m, tag, word) =>
      tag ? tag : `<span class="fk-word">${word}</span>`
    );
  }

  /* slot-machine number scramble then settle */
  function slotNumber(el) {
    const text  = el.textContent.trim();
    const match = text.match(/^([\d.]+)(.*)/);
    if (!match) return;
    const target = parseFloat(match[1]);
    const suffix = match[2];
    const chars  = '0123456789';
    let frame = 0;
    const total = 28;
    const raf = () => {
      frame++;
      if (frame < total * 0.7) {
        el.textContent = chars[Math.floor(Math.random() * chars.length)] + suffix;
      } else {
        const p = (frame - total * 0.7) / (total * 0.3);
        const ease = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * ease) + suffix;
      }
      if (frame < total) requestAnimationFrame(raf);
      else el.textContent = target + suffix;
    };
    requestAnimationFrame(raf);
  }

  /* ── Init ──────────────────────────────────── */
  function init() {
    const mainObs = makeObs(el => {
      el.classList.add('fk-in');
      if (el.dataset.fkNum) slotNumber(el);
    });

    /* h1 — word-by-word blur reveal */
    document.querySelectorAll('h1').forEach(h => {
      splitWords(h);
      h.querySelectorAll('.fk-word').forEach((w, i) => {
        w.style.transitionDelay = `${i * 70}ms`;
        mainObs.observe(w);
      });
    });

    /* h2 — fade+blur from below */
    document.querySelectorAll('h2').forEach(el => {
      el.classList.add('fk-hidden');
      mainObs.observe(el);
    });

    /* images — desaturate → saturate reveal */
    document.querySelectorAll('img').forEach(img => {
      if (img.parentElement) {
        img.parentElement.classList.add('fk-img-wrap');
        mainObs.observe(img.parentElement);
      }
    });

    /* stat numbers (large font-size) — slot machine */
    document.querySelectorAll('[style*="font-size: 52"],[style*="fontSize: 52"],[style*="font-size:52"]').forEach(el => {
      if (/^\d/.test(el.textContent.trim())) {
        el.dataset.fkNum = '1';
        el.classList.add('fk-num', 'fk-hidden-scale');
        mainObs.observe(el);
      }
    });

    /* p, li, buttons — staggered blur reveal */
    const genericObs = makeObs(el => el.classList.add('fk-in'), 0.08);
    document.querySelectorAll('p, li, button, a[style]').forEach((el, i) => {
      if (el.closest('.twk-panel')) return;
      el.classList.add('fk-hidden');
      el.style.transitionDelay = `${(i % 5) * 55}ms`;
      genericObs.observe(el);
    });
  }

  /* ── Boot (wait for React to render) ──────── */
  function boot() {
    const root = document.getElementById('root');
    if (!root) { setTimeout(boot, 100); return; }
    if (root.children.length > 0) { setTimeout(init, 500); return; }
    const mo = new MutationObserver(() => {
      if (root.children.length > 0) { mo.disconnect(); setTimeout(init, 500); }
    });
    mo.observe(root, { childList: true });
  }

  document.readyState === 'loading'
    ? document.addEventListener('DOMContentLoaded', boot)
    : boot();
})();

</script>
</body>
</html>
